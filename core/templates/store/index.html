{% extends 'base/base.html' %}

{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'index.css' %}">
{% endblock %}

{% block content %}

<!-- Catalog Section -->
<section id="catalogo" class="py-5 bg-white">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
            <div>
                <h2 class="display-6 mb-2">Productos</h2>
            </div>
        </div>


        <div class="row g-4" id="products-container" {% if not request.GET.categoria %}
            hx-get="{% url 'home' %}?categoria=estuches" hx-trigger="load delay:100ms" hx-push-url="true" hx-swap="none"
            {% endif %}>
            {% include "store/partials/product_cards.html" with page_obj=page_obj %}
        </div>

    </div>
</section>

{% endblock %}
